name: relaykit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relaykit
      POSTGRES_USER: relaykit
      POSTGRES_PASSWORD: relaykit_dev_password
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaykit -d relaykit"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
